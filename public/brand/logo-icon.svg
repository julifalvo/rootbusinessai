<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="sceneGlow" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#2e2e35"/>
      <stop offset="55%" stop-color="#212126"/>
      <stop offset="100%" stop-color="#131316"/>
    </radialGradient>
    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#3a3a44" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="badgeFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#46464f"/>
      <stop offset="100%" stop-color="#2a2a31"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#sceneGlow)"/>
  
  <g transform="translate(90,90)">
    <rect x="-18" y="-18" width="880" height="880" rx="201.68"
      fill="none" />
    <rect x="-14" y="-14" width="872" height="872" rx="197.68"
      fill="url(#badgeBorder)" opacity="0.9"/>
    <rect x="0" y="0" width="844" height="844" rx="185.68" fill="url(#badgeFace)"/>
    <rect x="0" y="0" width="844" height="844" rx="185.68" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="2"/>
    <svg x="0" y="0" width="844" height="844" viewBox="0 0 1024 1024">
      
  <defs>
    <linearGradient id="headFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1f"/>
