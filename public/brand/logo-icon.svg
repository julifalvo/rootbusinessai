      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="earGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26262b"/>
      <stop offset="100%" stop-color="#151517"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8ffff"/>
      <stop offset="45%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="antennaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e2c8ff"/>
      <stop offset="45%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="rBlurL" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="rBlurS" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
    <linearGradient id="haloCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="haloPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7000ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7000ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g transform="translate(0,-40)">
    <ellipse cx="512" cy="600" rx="330" ry="300" fill="#000000" opacity="0.28" filter="url(#rBlurL)"/>

    <g transform="translate(512,560)">
      <ellipse cx="0" cy="0" rx="380" ry="128" fill="none" stroke="url(#haloCyan)" stroke-width="6" transform="rotate(-18)"/>
      <ellipse cx="0" cy="0" rx="328" ry="110" fill="none" stroke="url(#haloPurple)" stroke-width="6" transform="rotate(14)"/>
    </g>

    <ellipse cx="512" cy="826" rx="176" ry="30" fill="none" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="11"/>

    <rect x="500" y="250" width="24" height="146" rx="12" fill="#2c2c31"/>
    <circle cx="512" cy="246" r="58" fill="url(#antennaGlow)" filter="url(#rBlurL)"/>
    <circle cx="512" cy="246" r="25" fill="#7000ff"/>
    <circle cx="512" cy="246" r="25" fill="#b98cff" opacity="0.5"/>

    <rect x="152" y="472" width="88" height="148" rx="44" fill="url(#earGrad)" stroke="#302f36" stroke-width="4"/>
    <rect x="784" y="472" width="88" height="148" rx="44" fill="url(#earGrad)" stroke="#302f36" stroke-width="4"/>

    <rect x="264" y="362" width="496" height="456" rx="94" fill="url(#headFace)" stroke="#323238" stroke-width="4"/>

    <rect x="334" y="522" width="356" height="148" rx="28" fill="#050b0d" stroke="#0f2226" stroke-width="3"/>

    <circle cx="434" cy="596" r="56" fill="url(#eyeGlow)" filter="url(#rBlurS)"/>
    <circle cx="590" cy="596" r="56" fill="url(#eyeGlow)" filter="url(#rBlurS)"/>
    <circle cx="434" cy="596" r="29" fill="#00f0ff"/>
    <circle cx="590" cy="596" r="29" fill="#00f0ff"/>
    <circle cx="434" cy="596" r="29" fill="none" stroke="#eafffe" stroke-width="2" opacity="0.65"/>
    <circle cx="590" cy="596" r="29" fill="none" stroke="#eafffe" stroke-width="2" opacity="0.65"/>
  </g>

    </svg>
  </g>
</svg>